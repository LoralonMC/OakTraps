# ============================================================
#  OakTraps
#  Lure-based mob capture cages. Place a trap, lure a mob onto
#  the pressure plate to capture it, then relocate or release.
# ============================================================

# Enable verbose debug logging.
debug: false

# ============================================================
# TRAP ITEM
# ============================================================
# The item players place to deploy a cage. The block it becomes
# is configured under "cage" below.
trap-item:
  material: BARREL
  name: "<#E5C5D0>Mob Trap"
  glow: true
  # Lore shown on an empty (unset) trap.
  lore-empty:
    - "<#6C757D>An empty trap."
    - ""
    - "<#f2ebd7>Place it and lure a mob onto"
    - "<#f2ebd7>the trap to capture it."
  # Lore shown on a filled trap. Placeholders:
  #   <entity_type>  <entity_name>  <entity_health>
  #   <entity_max_health>  <entity_damage>
  lore-filled:
    - "<#6C757D>Holds: <#FCD472><entity_type>"
    - ""
    - "<#6C757D>ʜᴇᴀʟᴛʜ: <#FCD472><entity_health><#6C757D>/<#FCD472><entity_max_health>"
    - "<#6C757D>ᴅᴀᴍᴀɢᴇ: <#FCD472><entity_damage>"
    - ""
    - "<#FCD472>[ᴘʟᴀᴄᴇ ᴛᴏ ᴅᴇᴘʟᴏʏ]"

# ============================================================
# CAPTURE RULES
# ============================================================
capture:
  # Which mobs may be captured.
  # mode BLACKLIST = everything except the list; WHITELIST = only the list.
  # Names are vanilla entity ids (lowercase), e.g. zombie, cave_spider.
  allowed-entities:
    enabled: true
    mode: BLACKLIST
    list:
      - "warden"
  # PDC keys that make an entity untrappable, whatever the list above says.
  # Other plugins tag the entities they own this way; a tagged entity has a
  # plugin managing when it exists, so sealing it inside a trap item strands it.
  #
  # oakpets:pet_owner is on every OakPets pet, including one that has leaked out
  # of OakPets's own bookkeeping and looks like an ordinary pig. That is the
  # case this exists for, since a live pet already can't trip a plate (OakPets
  # cancels the interact).
  protected-tags:
    - "oakpets:pet_owner"
  # Allow capturing someone's tamed pet (wolves, cats, horses, ...).
  # TRUE is safe: a capture is only allowed when the pet's owner matches the trap
  # owner, so this is "move your own pet", never pet theft. Applies to OWNED mobs
  # only — camels and skeleton-horse-trap horses report as tamed while belonging
  # to nobody, so they count as wild and are caught like any other mob.
  can-trap-tamed: true
  # Ticks between a mob stepping on the plate and being captured (20 = 1s). A
  # short delay lets the pressure plate visibly depress — the trap "springs" —
  # before the mob is caught. Set to 0 for instant capture.
  trigger-delay-ticks: 10
  # Particle burst played the moment a mob is caught, right after the trigger
  # delay above, so it punctuates the trap springing rather than competing with
  # it. Players lure mobs in from a block away, so keep it tight and brief: a
  # sustained effect at that range hides the thing it is meant to celebrate.
  # Set type to NONE to disable. Only particles that need no extra data are
  # supported (DUST, BLOCK, ITEM and friends are rejected with a warning).
  particle:
    type: CLOUD
    count: 12
    # How far the burst spreads from the trap, in blocks.
    spread: 0.25
    # Particle velocity. Keep low so the burst stays put instead of drifting.
    speed: 0.02
  # Restrict which worlds capturing works in.
  worlds:
    enabled: false
    mode: BLACKLIST
    list:
      - "world_the_end"

# ============================================================
# CAGE
# ============================================================
cage:
  # An ARMED (empty) trap is a flush pressure plate. A mob that steps on it is
  # captured. Use a wooden plate so all mob sizes trigger it; players can't
  # trigger their own traps.
  pressure-plate: ACACIA_PRESSURE_PLATE
  # A FILLED trap becomes this block (holds the captured mob). Right-click it to
  # release the mob and get the trap back.
  filled-block:
    material: BARREL
    data: "[facing=down,open=true]"
  # The "cage" shown around an armed trap: five barrel block-displays
  # (centre + north/south/east/west). Purely visual.
  visual:
    enabled: true
    # Vertical offset (in blocks) of the flat barrel base.
    barrel-y: 0.0
    # Thickness (vertical scale) of each barrel slab: small = thin slab, 1.0 = a
    # full-height barrel.
    barrel-thickness: 0.03
    # Thickness of the centre barrel piece. Keep it slightly different from
    # barrel-thickness so the centre and sides don't z-fight at the seams.
    center-thickness: 0.02
    # Vertical offset of the coral "teeth" decoration.
    decoration-y: -0.09
    # Decorative block displayed in the centre of the cage (the dead coral fan
    # looks like bear-trap "teeth"). It's a display entity, so it shows ON TOP of
    # the cage without hiding the pressure-plate trigger. Set material to AIR to
    # remove it.
    decoration:
      material: DEAD_BUBBLE_CORAL_FAN
      data: "[waterlogged=false]"
    barrels:
      center:
        material: BARREL
        data: "[facing=down,open=true]"
      north:
        material: BARREL
        data: "[facing=north,open=false]"
      south:
        material: BARREL
        data: "[facing=south,open=false]"
      east:
        material: BARREL
        data: "[facing=east,open=false]"
      west:
        material: BARREL
        data: "[facing=west,open=false]"

# ============================================================
# RELEASE
# ============================================================
release:
  # If true, releasing a mob breaks the trap instead of returning it — making
  # each trap single-use. If false, the player gets the empty trap back.
  break-on-release: false
  # A filled trap is a barrel, so the natural assumption is that right-clicking
  # opens a container. It does not: it releases the mob, and with
  # break-on-release on it also destroys the trap. These two settings guard that.
  #
  # Ask for a second right-click before releasing. The first click warns and
  # names the mob; a second click within this many seconds commits. 0 disables
  # the confirmation entirely.
  confirm-seconds: 5
  # Additionally require the player to be sneaking to release. Off by default —
  # the confirmation above tells the player what is about to happen, where a
  # sneak requirement only makes it harder to reach by accident. The two stack
  # if you enable both.
  require-sneak: false

# ============================================================
# PROTECTION (integration hooks)
# ============================================================
# Each only applies if the matching plugin is installed.
protection:
  # Respect WorldGuard build/region rights at the cage location.
  respect-worldguard: true
  # Respect Lands claims — a cage can't capture mobs in claims the
  # placer isn't trusted in (no mob-stealing).
  respect-lands: true
  # Allow placing cages inside protected regions/claims at all.
  allow-place-in-protected: false

# ============================================================
# MYTHICMOBS
# ============================================================
# Controls which MythicMobs can be captured (only if MythicMobs is installed).
mythicmobs:
  allowed:
    enabled: false
    mode: BLACKLIST
    list: []

# ============================================================
# CRAFTING
# ============================================================
# Optional recipe for the empty trap item.
crafting:
  enabled: false
  shape:
    - "III"
    - "I I"
    - "IBI"
  ingredients:
    I: IRON_BARS
    B: BARREL

# ========================================
#          DO NOT EDIT BELOW
# ========================================
config-version: 1
