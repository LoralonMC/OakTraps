plugins {
    id 'java'
    id("com.gradleup.shadow") version "9.3.1"
}

group = 'dev.oakheart'
version = '1.1.0'

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "jitpack"
        url = "https://jitpack.io"
    }
    maven {
        name = "enginehub"
        url = "https://maven.enginehub.org/repo/"
    }
    maven {
        name = "shopkeepers"
        url = "https://raw.githubusercontent.com/Shopkeepers/Repository/main/releases/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:26.1.2.build.+")
    // MythicMobs is integrated via reflection (see hooks/MythicMobsHook) — no compile dep.
    compileOnly("com.github.angeschossen:LandsAPI:7.24.1")
    compileOnly("com.nisovin.shopkeepers:ShopkeepersAPI:2.24.0")
    compileOnly("com.sk89q.worldguard:worldguard-bukkit:7.0.13") {
        // WG pins Guava/Gson/fastutil to exact versions that conflict with Paper's.
        // We only need WG's own classes at compile time; the server provides
        // the rest at runtime.
        exclude group: 'com.google.guava'
        exclude group: 'com.google.code.gson'
        exclude group: 'it.unimi.dsi'
        exclude group: 'org.apache.logging.log4j'
        exclude group: 'org.bstats'
    }
    implementation("org.bstats:bstats-bukkit:3.1.0")
    implementation("dev.oakheart:oakheart-core:1.3.0")
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

compileJava {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}

shadowJar {
    archiveClassifier.set('')
    relocate("org.bstats", "dev.oakheart.oaktraps.bstats")
    relocate("dev.oakheart.config", "dev.oakheart.oaktraps.libs.config")
    relocate("dev.oakheart.message", "dev.oakheart.oaktraps.libs.message")
    relocate("dev.oakheart.command", "dev.oakheart.oaktraps.libs.command")
    relocate("dev.oakheart.util", "dev.oakheart.oaktraps.libs.util")
}

jar {
    archiveClassifier.set('slim')
}

tasks.assemble.dependsOn(tasks.shadowJar)
